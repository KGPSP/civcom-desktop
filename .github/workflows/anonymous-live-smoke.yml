name: Anonymous production smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: anonymous-production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name != 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CIVCOM_ALLOW_ANONYMOUS_PRODUCTION_SMOKE: confirmed
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npm run test:live:anonymous
