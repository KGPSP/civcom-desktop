name: CI

on:
  push:
  pull_request:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Configure Electron SUID sandbox on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          workspace_path="$(realpath "$GITHUB_WORKSPACE")"
          sandbox_path="$workspace_path/node_modules/electron/dist/chrome-sandbox"
          test -f "$sandbox_path"
          test ! -L "$sandbox_path"
          test "$(realpath "$sandbox_path")" = "$sandbox_path"
          sudo chown root:root -- "$sandbox_path"
          sudo chmod 4755 -- "$sandbox_path"
          test "$(stat -c '%u:%g:%a' "$sandbox_path")" = "0:0:4755"
      - run: npm run verify
      - run: xvfb-run -a npm run test:electron:local
